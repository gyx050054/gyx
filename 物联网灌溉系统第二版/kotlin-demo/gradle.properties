# =============================================================================
# 📄 gradle.properties
# 作用：Gradle 全局配置 — 影响整个构建过程的参数
# =============================================================================

# -------- 构建性能 --------
# JVM 最大堆内存（Gradle 运行时可使用的最大内存）
# 2048m = 2GB，如果电脑内存小可以改成 1024m
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 并行构建：多个模块同时编译，加快速度
org.gradle.parallel=true

# 构建缓存：重复编译时直接使用缓存结果，秒级完成
org.gradle.caching=true

# -------- Android 专属 --------
# 使用 AndroidX（新版支持库，所有新项目必须开）
android.useAndroidX=true

# R 文件非传递模式：每个模块只生成自己的 R 类，减少编译冲突
android.nonTransitiveRClass=true

# -------- Kotlin 风格 --------
# 官方代码风格（与 Kotlin 官方推荐的格式化规则一致）
kotlin.code.style=official

# Compose 编译器由 kotlin.plugin.compose 插件管理，无需额外配置
android.overridePathCheck=true
